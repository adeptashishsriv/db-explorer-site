<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — Astro Adept AI Labs Blog</title>
  <meta name="description" content="Sign in to write blog posts for Astro Adept AI Labs.">
  <link rel="icon" type="image/png" href="../images/astro-adept-ai-labs.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style.css">
  <style>
    .signin-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 80px 20px;
    }

    .signin-container {
      background: var(--bg-card);
      border-radius: 12px;
      padding: 40px;
      box-shadow: var(--shadow-md);
      max-width: 400px;
      width: 100%;
    }

    .signin-heading {
      font-size: clamp(1.75rem, 4vw, 2.25rem);
      font-weight: 800;
      margin-bottom: 16px;
      color: var(--text);
      letter-spacing: -0.02em;
    }

    .signin-subheading {
      color: var(--text-muted);
      font-size: 1rem;
      margin-bottom: 32px;
      line-height: 1.6;
    }

    .signin-options {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .signin-options .auth-option {
      width: 100%;
      justify-content: center;
      padding: 12px 20px;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 8px;
      border: 1px solid var(--border-light);
      background: var(--bg-body);
      color: var(--text);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .signin-options .auth-option:hover {
      border-color: var(--text-dim);
      background: var(--bg-hover);
    }

    .signin-options .auth-option svg {
      margin-right: 10px;
    }

    /* Inherit navbar styles */
    .navbar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      background: var(--bg-body);
      border-bottom: 1px solid var(--border);
      padding: 15px 0;
      z-index: 1000;
      transition: background 0.3s ease, border-color 0.3s ease;
    }

    .navbar.scrolled {
      background: var(--bg-card);
      border-color: var(--border-light);
      box-shadow: var(--shadow-sm);
    }

    .nav-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px;
    }

    .nav-logo {
      display: flex;
      align-items: center;
      font-weight: 700;
      font-size: 1.2rem;
      color: var(--text);
      text-decoration: none;
    }

    .nav-logo-img {
      height: 30px;
      margin-right: 10px;
    }

    .nav-toggle {
      display: none;
      flex-direction: column;
      justify-content: space-around;
      width: 24px;
      height: 20px;
      background: transparent;
      border: none;
      cursor: pointer;
      padding: 0;
    }

    .nav-toggle span {
      display: block;
      width: 100%;
      height: 2px;
      background: var(--text);
      border-radius: 2px;
      transition: all 0.3s ease;
    }

    .nav-links {
      display: flex;
      list-style: none;
      margin: 0;
      padding: 0;
      align-items: center;
    }

    .nav-links li {
      margin-left: 25px;
    }

    .nav-links a {
      color: var(--text-muted);
      text-decoration: none;
      font-weight: 500;
      transition: color 0.2s ease;
    }

    .nav-links a:hover {
      color: var(--primary);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .btn-nav {
      padding: 8px 16px;
      font-size: 0.9rem;
    }

    .btn-primary {
      background: var(--primary);
      color: var(--white);
      border: 1px solid var(--primary);
    }

    .btn-primary:hover {
      background: var(--primary-dark);
      border-color: var(--primary-dark);
    }

    .btn-secondary {
      background: var(--bg-card);
      color: var(--text);
      border: 1px solid var(--border-light);
    }

    .btn-secondary:hover {
      border-color: var(--text-dim);
      background: var(--bg-hover);
    }

    .theme-switcher, .auth-switcher {
      position: relative;
      margin-left: 25px;
    }

    .theme-btn, .auth-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 0;
      font-size: 1rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      transition: color 0.2s ease;
    }

    .theme-btn:hover, .auth-btn:hover {
      color: var(--primary);
    }

    .theme-btn svg {
      margin-right: 5px;
    }

    .theme-dropdown, .auth-dropdown {
      position: absolute;
      top: calc(100% + 10px);
      right: 0;
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      border-radius: 8px;
      box-shadow: var(--shadow-lg);
      min-width: 160px;
      padding: 8px 0;
      display: none;
      flex-direction: column;
      z-index: 1001;
    }

    .theme-dropdown.open, .auth-dropdown.open {
      display: flex;
    }

    .theme-option, .auth-option {
      background: transparent;
      border: none;
      color: var(--text);
      padding: 10px 15px;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      font-size: 0.9rem;
      transition: background 0.2s ease;
    }

    .theme-option:hover, .auth-option:hover {
      background: var(--bg-hover);
    }

    .theme-option.active {
      background: var(--primary-glow);
      color: var(--primary);
      font-weight: 600;
    }

    .theme-swatch {
      width: 16px;
      height: 16px;
      border-radius: 4px;
      margin-right: 10px;
      display: inline-block;
    }

    .auth-option svg {
      margin-right: 10px;
    }

    @media (max-width: 768px) {
      .nav-toggle {
        display: flex;
      }

      .nav-links {
        display: none;
        flex-direction: column;
        position: absolute;
        top: 100%;
        left: 0;
        width: 100%;
        background: var(--bg-card);
        border-top: 1px solid var(--border);
        padding: 20px 0;
        box-shadow: var(--shadow-md);
      }

      .nav-links.open {
        display: flex;
      }

      .nav-links li {
        margin: 10px 0;
        text-align: center;
      }

      .theme-switcher, .auth-switcher {
        margin: 10px auto;
      }

      .theme-dropdown, .auth-dropdown {
        left: 50%;
        transform: translateX(-50%);
        right: auto;
      }
    }
  </style>
</head>

  <!-- ===== Inline JS: navbar, mobile menu, theme switcher ===== -->
  <script>
    // Navbar scroll effect
    window.addEventListener('scroll', () => {
      document.getElementById('navbar').classList.toggle('scrolled', window.scrollY > 40);
    });

    // Mobile menu toggle
    function toggleMenu() {
      document.getElementById('navLinks').classList.toggle('open');
    }

    // Close menu on link click
    document.querySelectorAll('.nav-links a').forEach(link => {
      link.addEventListener('click', () => {
        document.getElementById('navLinks').classList.remove('open');
      });
    });

    // Theme switcher
    var themeBtn = document.getElementById('themeToggle');
    var themeDropdown = document.getElementById('themeDropdown');

    themeBtn.addEventListener('click', function(e) {
      e.stopPropagation();
      themeDropdown.classList.toggle('open');
    });

    document.addEventListener('click', function() {
      themeDropdown.classList.remove('open');
    });

    themeDropdown.addEventListener('click', function(e) {
      e.stopPropagation();
    });

    document.querySelectorAll('.theme-option').forEach(function(btn) {
      btn.addEventListener('click', function() {
        var theme = btn.dataset.theme;
        document.documentElement.setAttribute('data-theme', theme);
        localStorage.setItem('db-explorer-theme', theme);
        themeDropdown.classList.remove('open');
        document.querySelectorAll('.theme-option').forEach(function(b) { b.classList.remove('active'); });
        btn.classList.add('active');
      });
    });

    // Load saved theme on page load
    (function() {
      var saved = localStorage.getItem('db-explorer-theme');
      if (saved) {
        document.documentElement.setAttribute('data-theme', saved);
        var active = document.querySelector('.theme-option[data-theme="' + saved + '"]');
        if (active) active.classList.add('active');
      } else {
        var def = document.querySelector('.theme-option[data-theme="midnight"]');
        if (def) def.classList.add('active');
      }
    })();

    // Auth switcher
    var authToggle = document.getElementById('authToggle');
    var authDropdown = document.getElementById('authDropdown');

    authToggle.addEventListener('click', function(e) {
      e.stopPropagation();
      authDropdown.classList.toggle('open');
    });

    document.addEventListener('click', function() {
      authDropdown.classList.remove('open');
    });

    authDropdown.addEventListener('click', function(e) {
      e.stopPropagation();
    });

    // Auth state will be handled by the module script below
  </script>

  <!-- ===== Auth handling ===== -->
  <script type="module">
    import './js/firebase-init.js';
    import {
      signInWithProvider,
      signOut,
      onAuthStateChanged,
    } from './js/auth.js';

    // Auth switcher state management
    let currentUser = null;

    function updateAuthButton(user) {
      currentUser = user;
      const authToggle = document.getElementById('authToggle');
      const authDropdown = document.getElementById('authDropdown');

      if (user) {
        // Signed in - show user name and sign out option
        authToggle.textContent = user.displayName || user.email || 'User';
        authToggle.title = 'Sign out';
        // Change dropdown to sign out option
        authDropdown.innerHTML = `
          <button class="auth-option" id="navbarSignOut">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16,17 21,12 16,7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            Sign Out
          </button>
        `;
        // Add sign out handler
        document.getElementById('navbarSignOut').addEventListener('click', async () => {
          try {
            await signOut();
            authDropdown.classList.remove('open');
            // After sign out, if on signin.html, redirect to blog index
            if (window.location.pathname.includes('signin.html')) {
              window.location.href = 'index.html';
            }
          } catch (err) {
            console.error('Sign-out error:', err);
          }
        });
      } else {
        // Not signed in - show sign in options
        authToggle.textContent = 'Sign In';
        authToggle.title = 'Sign in';
        authDropdown.innerHTML = `
          <button class="auth-option" id="navbarGoogle">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
            Google
          </button>
          <button class="auth-option" id="navbarGithub">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0 1 12 6.844a9.59 9.59 0 0 1 2.504.337c1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.02 10.02 0 0 0 22 12.017C22 6.484 17.522 2 12 2z"/></svg>
            GitHub
          </button>
          <button class="auth-option" id="navbarFacebook">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="#1877F2" aria-hidden="true"><path d="M24 12.073C24 5.405 18.627 0 12 0S0 5.405 0 12.073C0 18.1 4.388 23.094 10.125 24v-8.437H7.078v-3.49h3.047V9.41c0-3.025 1.792-4.697 4.533-4.697 1.312 0 2.686.236 2.686.236v2.97h-1.513c-1.491 0-1.956.93-1.956 1.886v2.267h3.328l-.532 3.49h-2.796V24C19.612 23.094 24 18.1 24 12.073z"/></svg>
            Facebook
          </button>
        `;
        // Add sign in handlers
        document.getElementById('navbarGoogle').addEventListener('click', () => handleProviderSignIn('google'));
        document.getElementById('navbarGithub').addEventListener('click', () => handleProviderSignIn('github'));
        document.getElementById('navbarFacebook').addEventListener('click', () => handleProviderSignIn('facebook'));
      }
    }

    async function handleProviderSignIn(providerName) {
      try {
        await signInWithProvider(providerName);
        document.getElementById('authDropdown').classList.remove('open');
        // After successful sign-in, redirect to write.html
        window.location.href = 'write.html';
      } catch (err) {
        console.error('Sign-in error:', err);
        alert('Sign-in failed: ' + err.message);
      }
    }

    // Auth state subscription
    onAuthStateChanged(user => {
      updateAuthButton(user);
      if (user && window.location.pathname.includes('signin.html')) {
        // If user is signed in and on the signin page, redirect to write.html
        window.location.href = 'write.html';
      }
    });

    // Add event listeners for the sign-in buttons on this page
    document.getElementById('googleSignInBtn').addEventListener('click', () => handleProviderSignIn('google'));
    document.getElementById('githubSignInBtn').addEventListener('click', () => handleProviderSignIn('github'));
    document.getElementById('facebookSignInBtn').addEventListener('click', () => handleProviderSignIn('facebook'));
  </script>

</body>
</html>
